const BASE={"beasts":["raccoon","raccoon","raccoon","raccoon","rabbit","rabbit","rabbit","rabbit","hedgehog","hedgehog","wolf","wolf","wolf","mouse","huntinghowl"],"dragons":["hatchling","hatchling","hatchling","hatchling","scaleling","scaleling","scaleling","emberbat","emberbat","emberbat","skyscorcher","skyscorcher","stonedrake","dragonbreath","flamegout"],"fairies":["puck","puck","puck","puck","puck","puck","spellkeeper","spellkeeper","echowisp","echowisp","stardust","stardust","moonwell","lullaby","glimmer"],"fishes":["minnow","minnow","minnow","minnow","sardine","sardine","sardine","sardine","hermitcrab","hermitcrab","pondcarp","pondcarp","harbortortoise","tide","ebbtide"],"robots":["tinbot","tinbot","tinbot","tinbot","coglet","coglet","coglet","coglet","bombot","bombot","magnetdrone","magnetdrone","linkedreactor","repairkit","treads"],"trees":["daisy","daisy","daisy","fern","fern","fern","berrybush","berrybush","seedling","seedling","acorn","acorn","puffcap","logroller","hollowoak"],"undead":["zombie","zombie","zombie","gravedigger","gravedigger","gravedigger","rattlebones","rattlebones","rattlebones","silentmourner","cellarshambler","necromancer","bonecolossus","paleghost","bonegiant"],"warriors":["squire","squire","squire","squire","archer","archer","archer","cadet","cadet","recruit","recruit","herald","commander","king","wardrum"]};

const FAMS=["warriors","beasts","robots","fairies","undead","fishes","trees","dragons"];
const byId=Object.fromEntries(CARDS.map(card=>[card.id,card]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const el=(t,cls,txt)=>{const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function art(card){
  const image=new Image();
  image.className="art";
  image.alt="";
  image.loading="lazy";
  image.width=122;
  image.height=76;
  image.src="art/"+card.id+".png";
  return image;
}
const effectText=c=>c.fx || (c.a===0?"Blocks its lane and can be sacrificed.":"Attacks the opposing unit, or the rival if its lane is clear.");
// Rules text sometimes uses a token's short name or a plural.
const referenceIds = new Map(CARDS.map(card => [card.n, card.id]));
for (const [name, id] of Object.entries({
  Remains: "remnant", Cubs: "cub", "Polished Bones": "bone",
  Summer: "yggra_summer", Autumn: "yggra_autumn"
})) referenceIds.set(name, id);
const referenceNames = [...referenceIds.keys()].sort((a, b) => b.length - a.length);
const referencePattern = new RegExp("\\b(?:" + referenceNames.map(name =>
  name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "g");

function cardEffect(card, className) {
  const content = el("div", className);
  const text = effectText(card);
  let offset = 0;
  for (const match of text.matchAll(referencePattern)) {
    const word = match[0];
    const target = byId[referenceIds.get(word)];
    // Heralds draw from the Knights family. Their text names a family, not a specific card.
    if (target === card || (word === "Knight" && ["herald", "crownherald"].includes(card.id))) continue;
    content.append(text.slice(offset, match.index));
    const link = el("button", "card-reference", word);
    link.setAttribute("aria-label", "View " + target.n);
    link.setAttribute("aria-haspopup", "dialog");
    link.onclick = () => openCard(target, card);
    content.append(link);
    offset = match.index + word.length;
  }
  content.append(text.slice(offset));
  return content;
}
const costText=c=>c.c===0?"Free":"Sacrifice "+c.c;
let deck=[];try{deck=(JSON.parse(localStorage.getItem("kaboonDeck"))||[]).filter(id=>byId[id]&&!byId[id].tok)}catch(e){}
const save=()=>{try{localStorage.setItem("kaboonDeck",JSON.stringify(deck))}catch(e){}};
const state={fam:"all",rar:"all",q:""};
function chipRow(host,items,key){items.forEach(([v,l])=>{const b=el("button","chip",l);b.setAttribute("aria-pressed",state[key]===v);b.onclick=()=>{state[key]=v;[...host.querySelectorAll("button")].forEach(o=>o.setAttribute("aria-pressed",o===b));renderGrid()};host.append(b)})}

function canAdd(c){if(deck.length>=30)return "A deck holds 30 cards at most.";const l=LIMIT[c.r];if(l&&deck.filter(i=>i===c.id).length>=l)return RN[c.r]+" cards: "+l+" cop"+(l>1?"ies":"y")+" at most.";return ""}
let msg="";
function add(id){const c=byId[id];msg=canAdd(c);if(!msg){deck.push(id);save()}renderGrid();renderDeck()}
function remove(id){const i=deck.lastIndexOf(id);if(i>=0){deck.splice(i,1);save()}msg="";renderGrid();renderDeck()}
const SORTED=CARDS.slice().sort((a,b)=>FAMS.indexOf(a.d)-FAMS.indexOf(b.d)||RO.indexOf(a.r)-RO.indexOf(b.r)||a.c-b.c||a.n.localeCompare(b.n));
function renderGrid(){
  const g=document.getElementById("grid");const keep=window.scrollY;g.textContent="";let n=0;const counts={};deck.forEach(i=>counts[i]=(counts[i]||0)+1);
  const note=document.getElementById("scope-note");
  note.hidden=document.getElementById("scope").value!=="starter";
  note.textContent="Each family list contains 15 cards. Dragons unlock later in the journey.";
  SORTED.forEach(c=>{
    const scope=document.getElementById("scope").value;
    if(scope==="tokens" ? !c.tok : c.tok)return;
    const copies=BASE[c.d]?.filter(id=>id===c.id).length||0;
    if(scope==="starter" && !copies)return;
    if(state.fam!=="all"&&c.d!==state.fam)return;if(state.rar!=="all"&&c.r!==state.rar)return;
    if(state.q&&!(c.n.toLowerCase().includes(state.q)||effectText(c).toLowerCase().includes(state.q)))return;
    n++;const t=el("div","tile");t.style.setProperty("--c","var(--"+c.r+")");
    const detail=el("button","face");detail.setAttribute("aria-label","View "+c.n);detail.onclick=()=>openCard(c);
    const b=el("div","tbody");b.append(el("div","nm",c.n));
    const tg=el("div","tags");tg.append(el("span","pill",RN[c.r]),el("span","tag",FAMILY_NAMES[c.d]));b.append(tg);
    const m=el("div","meta");const add1=(l,v)=>{const s=el("span","",l+" ");s.append(el("b","",v));m.append(s)};
    m.append(el("b","",costText(c)));if(c.t==="unit"){add1("Attack",c.a);add1("Health",c.h)}else m.append(el("span","",cap(c.t)));b.append(m);

    if(scope==="starter")b.append(el("b","note",copies+" × in family deck"));
    detail.append(art(c),b);t.append(detail,cardEffect(c,"fx"));
    if(counts[c.id])t.append(el("span","cnt","×"+counts[c.id]));
    const a=el("button","add","+");a.title="Add to my deck";a.setAttribute("aria-label","Add "+c.n+" to my deck");a.onclick=e=>{e.stopPropagation();add(c.id)};if(!c.tok)t.append(a);
    g.append(t)});
  if(!n)g.append(el("p","note","No card matches these filters."));
  document.getElementById("count").textContent=n+" cards";window.scrollTo(0,keep);
}

const dbar=document.getElementById("dbar");
dbar.onclick=()=>{const a=document.getElementById("deck");const o=a.classList.toggle("open");dbar.setAttribute("aria-expanded",o);renderDeck()};
function renderDeck(){
  const a=document.getElementById("dbody");a.textContent="";
  const cs=deck.map(i=>byId[i]);
  dbar.textContent="My deck · "+cs.length+"/30 "+(document.getElementById("deck").classList.contains("open")?"▴":"▾");
  if(msg)a.append(el("div","warn",msg));
  const acts=el("div","acts");const sel=document.createElement("select");sel.id="preset";sel.setAttribute("aria-label","Load a basic deck");sel.append(new Option("Load a family deck…",""));FAMS.forEach(f=>sel.append(new Option(FAMILY_NAMES[f],f)));
  sel.onchange=()=>{if(sel.value){deck=BASE[sel.value].filter(i=>byId[i]);msg="";save();renderGrid();renderDeck()}};
  const clr=el("button","chip","Empty the deck");clr.onclick=()=>{deck=[];msg="";save();renderGrid();renderDeck()};acts.append(sel,clr);a.append(acts);

  a.append(el("h3","","Cards (tap to remove one)"));
  const dl=el("div","dl");const seen={};deck.forEach(i=>seen[i]=(seen[i]||0)+1);
  Object.keys(seen).map(i=>byId[i]).sort((x,y)=>x.c-y.c||x.n.localeCompare(y.n)).forEach(c=>{const b=el("button");b.style.setProperty("--c","var(--"+c.r+")");b.append(el("span","",seen[c.id]+"× "+c.n),el("span","note",(c.c===0?"Free":"Sac "+c.c)+(c.t==="unit"?" · "+c.a+"/"+c.h:"")));b.setAttribute("aria-label","Remove one "+c.n);b.onclick=()=>remove(c.id);dl.append(b)});a.append(dl);
}
let cardTrail = [];
function openCard(c, source){
  const dialog = document.getElementById("dlg");
  if (!dialog.open) cardTrail = [];
  if (source) cardTrail.push(source);
  const d=document.getElementById("dlg");d.textContent="";const w=el("div","dlg");w.style.setProperty("--c","var(--"+c.r+")");
  const h=el("div","dhead");const ar=art(c);
  const info=el("div","info");const top=el("div","chips");const title=el("h2","",c.n);title.id="card-name";top.append(title);const x=el("button","x","Close");x.onclick=()=>d.close();top.append(x);
  const sub=el("div","chips");sub.append(el("span","pill",RN[c.r]),el("span","note",FAMILY_NAMES[c.d]+" · "+cap(c.t)+" · "+costText(c)+(c.t==="unit"?" · Attack "+c.a+" · Health "+c.h:"")));
  if (cardTrail.length) {
    const previous = cardTrail[cardTrail.length - 1];
    const back = el("button","x","← Back to " + previous.n);
    back.onclick = () => openCard(cardTrail.pop());
    info.append(back);
  }
  info.append(top,sub);
  const ad=el("button","pri","+ Add to my deck");ad.onclick=()=>{add(c.id);ad.textContent=msg||("In deck: "+deck.filter(i=>i===c.id).length+" · add another")};const wr=el("div");wr.append(ad);if(!c.tok)info.append(wr);
  h.append(ar,info);w.append(h);
  w.append(el("h3","","Effect"),cardEffect(c,"effect"));
  d.append(w);if (!d.open) d.showModal();
  title.tabIndex=-1;title.focus({preventScroll:true});d.scrollTop=0;
}
